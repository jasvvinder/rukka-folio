include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/gen/**
    - lib/shared/tokens.dart
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
    - avoid_dynamic_calls
    - always_declare_return_types
    - avoid_print
