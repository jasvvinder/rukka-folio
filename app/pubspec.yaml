name: rukka_folio
description: Rukka Folio — the family's chits, kept on proper ledger pages. Flutter UI layer only (CLAUDE.md § Layout).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations
  go_router: ^17.1.0 # shell + feature routes (13 §3.1; shared/router.dart)
  drift: ^2.34.4 # NativeDatabase executor for package:data's LedgerDatabase
  # package:sqlite3 3.x (via data) bundles its native library through build hooks — no
  # sqlite3_flutter_libs. SQLCipher is selected the same way (sqlcipher_flutter_libs is EOL):
  # `hooks.user_defines.sqlite3.source: sqlcipher` in the WORKSPACE ROOT pubspec.yaml —
  # see features/devices/at_rest.dart. The key comes from KeychainKeyStore (06 §3, 04 §3.3).
  flutter_secure_storage: ^11.0.0 # iOS Keychain / Android Keystore for KeychainKeyStore (04 §3.3, ADR 2026-09-05d §4)
  sodium_libs: ^4.0.1 # libsodium binary for the app; core_crypto's CryptoSuite is injected with it (rule 7)
  path_provider: ^2.1.5 # app documents dir for the ledger file
  http: ^1.6.0 # HttpClientTransport → HttpAuthClient (06 §2–§4); the only HTTP door in the app
  path: ^1.9.1
  # pure engine packages — the app never reimplements what they own
  core_ledger:
    path: ../packages/core_ledger
  core_crypto:
    path: ../packages/core_crypto
  data:
    path: ../packages/data
  sync_engine:
    path: ../packages/sync_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # gen_l10n from l10n.yaml (arb-dir is the generated identifier-keyed copy)

  # 11 §4.4 — one family across nine scripts: Mukta (Latin + Devanagari), Mukta Mahee (Gurmukhi),
  # Noto Sans as the only fallback. OFL licences sit beside the files.
  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
    - family: MuktaMahee
      fonts:
        - asset: assets/fonts/MuktaMahee-Regular.ttf
          weight: 400
        - asset: assets/fonts/MuktaMahee-Medium.ttf
          weight: 500
        - asset: assets/fonts/MuktaMahee-SemiBold.ttf
          weight: 600
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans[wdth,wght].ttf
