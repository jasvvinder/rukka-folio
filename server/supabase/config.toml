# Rukka Folio — Supabase local-dev configuration (lane S, M4).
# The hosted project (docs/ops/lead-times.md §1) is ap-south-1 (Mumbai), Pro plan, PITR 7 d.
# Locally: `supabase start` (Docker) → `supabase db reset` applies migrations/ then seed.sql.
project_id = "rukka-folio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 500          # 05 §4: pull page ≤ 500

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true          # functions run SET LOCAL claims inside one transaction (ADR 2026-09-05c §7)
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false         # no e-mail anywhere in the product

[storage]
enabled = true
file_size_limit = "10MiB"   # 08 §2: 10 MB per file
[storage.buckets.attachments]
public = false               # ADR 2026-09-05c §8: private bucket, per-tenant prefix
file_size_limit = "10MiB"

# Platform auth is OFF: sessions are our own challenge–response JWT (06 §2, §4; ADR 2026-09-05c §7).
[auth]
enabled = false
[auth.sms]
enable_signup = false
[auth.external.apple]
enabled = false
[auth.external.google]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.sync-push]
verify_jwt = false      # our JWT, verified in _shared/claims.ts, not the platform's
[functions.sync-pull]
verify_jwt = false
[functions.sync-meta]
verify_jwt = false
[functions.auth-challenge]
verify_jwt = false
[functions.billing-webhook]
verify_jwt = false

[analytics]
enabled = false
