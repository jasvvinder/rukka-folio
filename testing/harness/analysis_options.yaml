include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
    - avoid_dynamic_calls
    - always_declare_return_types
    - avoid_print
    - public_member_api_docs
